<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArduinoRemote Controller</title>
<meta name="description" content="Web Bluetooth controller for the ArduinoRemote ESP32-C3 BLE remote — Forward and Back buttons.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b0c10;
    color: #c5c6c7;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #1f2833;
    border: 1px solid #45a29e;
    border-radius: 16px;
    padding: 32px;
    max-width: 420px;
    width: 92%;
    box-shadow: 0 0 30px rgba(69,162,158,0.12);
  }
  h1 { color: #66fcf1; font-size: 1.5rem; margin-bottom: 8px; }
  #deviceName { color: #66fcf1; font-size: 1rem; font-weight: 700; margin-bottom: 12px; text-align:center; }
  p.sub { color: #888; font-size: 0.85rem; margin-bottom: 20px; text-align:center; }
  .status { font-size: 0.8rem; color: #45a29e; margin-bottom: 16px; text-align:center; height: 1rem; }
  .status.connected { color: #66fcf1; }
  .status.disconnected { color: #fb507b; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 16px; }
  button {
    background: #45a29e;
    border: none;
    border-radius: 12px;
    color: #0b0c10;
    font-weight: 700;
    font-size: 1.1rem;
    padding: 24px 0;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.05s, filter 0.1s;
  }
  button:active { transform: scale(0.96); filter: brightness(1.15); }
  button.forward { background: #45a29e; }
  button.back    { background: #c5c6c7; color: #0b0c10; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .connect {
    width: 100%;
    background: #66fcf1;
    color: #0b0c10;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    padding: 12px 0;
    cursor: pointer;
    margin-bottom: 14px;
  }
  .connect:disabled { opacity: 0.5; }
  .rename-section {
    border-top: 1px solid #45a29e;
    padding-top: 16px;
    margin-top: 16px;
  }
  .rename-section h3 { color: #66fcf1; font-size: 0.95rem; margin-bottom: 10px; }
  .rename-input {
    width: 100%;
    background: #0b0c10;
    border: 1px solid #45a29e;
    border-radius: 8px;
    color: #c5c6c7;
    padding: 10px 12px;
    font-size: 0.95rem;
    margin-bottom: 10px;
    font-family: inherit;
  }
  .rename-input:focus { outline: none; border-color: #66fcf1; }
  button.rename {
    width: 100%;
    background: #45a29e;
    padding: 12px 0;
    font-size: 0.95rem;
  }
  button.rename:disabled { opacity: 0.5; cursor: not-allowed; }
  .hint { font-size: 0.75rem; color: #666; text-align:center; line-height: 1.4; margin-top: 12px; }
  code { color: #45a29e; }
</style>
</head>
<body>

<div class="card">
  <h1>ArduinoRemote</h1>
  <div id="deviceName">ArduinoRemote</div>
  <p class="sub">ESP32-C3 BLE remote &mdash; Forward / Back</p>

  <div id="status" class="status disconnected">Not connected</div>

  <button id="connect" class="connect">Connect to ArduinoRemote</button>

  <div class="btns">
    <button id="btnForward" class="forward" disabled>Forward &uarr;</button>
    <button id="btnBack" class="back" disabled>Back &darr;</button>
  </div>

  <div class="rename-section">
    <h3>Rename device</h3>
    <input type="text" id="renameInput" class="rename-input" placeholder="New device name" maxlength="31">
    <button id="btnRename" class="rename" disabled>Rename</button>
  </div>

  <p class="hint">Tap &ldquo;Connect&rdquo; and choose <code>ArduinoRemote</code>.<br>
  Press Forward / Back to send commands over BLE.<br>
  Status LED flashes on each press.</p>
</div>

<script>
const SERVICE_UUID  = '7f4f1234-1234-1234-1234-123456789abc';
const CHAR_TX_UUID  = '7f4f1236-1234-1234-1234-123456789abc'; // notify (ESP32 -> host)
const CHAR_RX_UUID  = '7f4f1235-1234-1234-1234-123456789abc'; // write (host -> ESP32)
const CHAR_RN_UUID  = '7f4f1237-1234-1234-1234-123456789abc'; // write new name (rename)

let txChar = null;
let rxChar = null;
let rnChar = null;
let connected = false;
let bluetoothDevice = null;
let gattServer = null;

const statusEl = document.getElementById('status');
const connectBtn = document.getElementById('connect');
const fwdBtn = document.getElementById('btnForward');
const backBtn = document.getElementById('btnBack');
const renameInput = document.getElementById('renameInput');
const btnRename = document.getElementById('btnRename');
const deviceNameEl = document.getElementById('deviceName');

function setStatus(txt, cls) {
  statusEl.textContent = txt;
  statusEl.className = 'status ' + cls;
}

function enableControls(en) {
  fwdBtn.disabled = !en;
  backBtn.disabled = !en;
  btnRename.disabled = !en;
  renameInput.disabled = !en;
  connectBtn.textContent = en ? 'Connected - disconnect' : 'Connect to ArduinoRemote';
}

function clearConnection() {
  connected = false;
  gattServer = null;
  txChar = null;
  rxChar = null;
  rnChar = null;
  enableControls(false);
}

async function connect() {
  if (!connected) {
    try {
      if (!navigator.bluetooth) {
        throw new Error('Web Bluetooth is unavailable in this browser');
      }
      bluetoothDevice = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SERVICE_UUID] }],
        optionalServices: [SERVICE_UUID]
      });
      deviceNameEl.textContent = bluetoothDevice.name || 'ArduinoRemote';
      bluetoothDevice.addEventListener('gattserverdisconnected', onDisconnected);

      gattServer = await bluetoothDevice.gatt.connect();
      const service = await gattServer.getPrimaryService(SERVICE_UUID);
      rxChar = await service.getCharacteristic(CHAR_RX_UUID);
      try {
        txChar = await service.getCharacteristic(CHAR_TX_UUID);
        txChar.addEventListener('characteristicvaluechanged', handleNotify);
        await txChar.startNotifications();
      } catch (txError) {
        console.warn('TX notifications unavailable:', txError);
        txChar = null;
      }
      try {
        rnChar = await service.getCharacteristic(CHAR_RN_UUID);
      } catch (rnError) {
        console.warn('Rename characteristic unavailable:', rnError);
        rnChar = null;
      }
      connected = true;
      setStatus(
        txChar
          ? 'Connected to ' + (bluetoothDevice.name || 'ArduinoRemote')
          : 'Connected (controls only)',
        'connected'
      );
      enableControls(true);
      btnRename.disabled = !rnChar;
    } catch (err) {
      console.error(err);
      setStatus('Connection failed: ' + err.message, 'disconnected');
    }
  } else {
    if (gattServer && gattServer.connected) {
      gattServer.disconnect();
    } else {
      clearConnection();
    }
    setStatus('Not connected', 'disconnected');
  }
}

function onDisconnected() {
  clearConnection();
  setStatus('Disconnected', 'disconnected');
}

function send(cmdChar) {
  if (!connected || !rxChar) return;
  const data = new Uint8Array([cmdChar.charCodeAt(0)]);
  const write = rxChar.writeValueWithoutResponse
    ? rxChar.writeValueWithoutResponse(data)
    : rxChar.writeValue(data);
  write.catch(err => {
    console.error('write failed', err);
    setStatus('Command failed: ' + err.message, 'disconnected');
  });
}

function handleNotify(event) {
  const value = event.target.value;
  if (!value) return;
  const cmd = String.fromCharCode(value.getUint8(0));
  console.log('notify:', cmd);
  if (cmd === 'R') {
    setStatus('Rename accepted. Reconnect to ' + (renameInput.value.trim() || 'the new name'), 'connected');
  } else if (cmd === 'r') {
    setStatus('Rename rejected: invalid name', 'disconnected');
  }
}

async function renameDevice() {
  if (!connected || !rnChar) return;
  const newName = renameInput.value.trim();
  const isValidAscii = /^[\x20-\x7E]+$/.test(newName);
  if (!newName || newName.length > 31 || !isValidAscii) {
    setStatus('Name must be 1-31 printable ASCII characters', 'disconnected');
    return;
  }
  try {
    const encoder = new TextEncoder();
    await rnChar.writeValue(encoder.encode(newName));
    setStatus('Renaming to "' + newName + '"...', 'connected');
    // Device restarts with new name; connection drops
    setTimeout(() => {
      connected = false;
      enableControls(false);
      setStatus('Device restarted. Reconnect to "' + newName + '"', 'connected');
    }, 1500);
  } catch (err) {
    console.error(err);
    setStatus('Rename failed: ' + err.message, 'disconnected');
  }
}

connectBtn.addEventListener('click', connect);
fwdBtn.addEventListener('click', () => send('F'));
backBtn.addEventListener('click', () => send('B'));
btnRename.addEventListener('click', renameDevice);
renameInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') renameDevice(); });

// Web Bluetooth requires a secure context (HTTPS or localhost)
if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
  setStatus('HTTPS required for Web Bluetooth', 'disconnected');
  connectBtn.disabled = true;
  connectBtn.textContent = 'Serve over HTTPS to connect';
}
</script>

</body>
</html>
